@if (authService.isLogged()) {
    <app-navbar-ui
        [user]="navUser"
        (searchSubmit)="onSearch($event)"
        (logoutClick)="logout()"
    ></app-navbar-ui>
} @else {
    <app-navbar-ui
        (signInClick)="startLogin()"
        (searchSubmit)="onSearch($event)"
    ></app-navbar-ui>
}

<ng-content></ng-content>

<app-footer></app-footer>

<app-toast-container />
