<nav class="navbar">
    <div class="nav-inner">
        <!-- Logo -->
        <a class="logo" (click)="logoClick.emit()">
            <span class="logo-m">M</span><span class="logo-v">V</span>FLIX
        </a>

        <!-- Nav links -->
        <div class="nav-links">
            @for (link of links(); track link.route) {
                <a
                    class="nav-link"
                    [class.active]="activeRoute() === link.route"
                    (click)="navClick.emit(link.route)"
                >
                    @if (link.icon) {
                        <span class="nav-icon" [innerHTML]="link.icon"></span>
                    }
                    {{ link.label }}
                </a>
            }
        </div>

        <!-- Search (desktop) -->
        <div class="search-desktop">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
                class="search-input"
                type="text"
                placeholder="Search movies..."
                [ngModel]="searchQuery()"
                (ngModelChange)="searchQuery.set($event); searchChange.emit($event)"
                (keydown.enter)="searchSubmit.emit(searchQuery())"
            />
        </div>

        <!-- Right side -->
        <div class="nav-right">
            <!-- Uploads drawer trigger -->
            <button class="icon-btn uploads-btn" (click)="uploadClick.emit()" title="Uploads"
                    [attr.aria-label]="'Uploads'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                @if (uploadCount() > 0) {
                    <span class="uploads-badge">{{ uploadCount() }}</span>
                }
            </button>

            <!-- Mobile search toggle -->
            <button class="icon-btn mobile-search-btn" (click)="mobileSearchOpen.set(!mobileSearchOpen())">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>

            @if (user(); as u) {
                <div class="user-menu" tabindex="0">
                    <div class="user-trigger" (click)="menuOpen.set(!menuOpen())">
                        @if (u.picture) {
                            <img class="avatar" [src]="u.picture" [alt]="u.username ?? ''"/>
                        } @else {
                            <div class="avatar avatar-fallback">{{ (u.username ?? '?')[0].toUpperCase() }}</div>
                        }
                        <span class="username">{{ u.username }}</span>
                        <svg class="chevron" [class.open]="menuOpen()" width="12" height="12" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>

                    @if (menuOpen()) {
                        <div class="dropdown">
                            <button class="dropdown-item" (click)="profileClick.emit(); menuOpen.set(false)">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                Profile
                            </button>
                            <button class="dropdown-item" (click)="settingsClick.emit(); menuOpen.set(false)">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path
                                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                                </svg>
                                Settings
                            </button>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item danger" (click)="logoutClick.emit(); menuOpen.set(false)">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                Sign out
                            </button>
                        </div>
                    }
                </div>
            } @else {
                <div class="auth-buttons">
                    <button class="btn btn-ghost" (click)="signInClick.emit()">Sign in</button>
                    <button class="btn btn-primary" (click)="signUpClick.emit()">Sign up</button>
                </div>
            }
        </div>
    </div>

    <!-- Mobile search bar -->
    @if (mobileSearchOpen()) {
        <div class="search-mobile">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
                class="search-input"
                type="text"
                placeholder="Search movies..."
                [ngModel]="searchQuery()"
                (ngModelChange)="searchQuery.set($event); searchChange.emit($event)"
                (keydown.enter)="searchSubmit.emit(searchQuery()); mobileSearchOpen.set(false)"
                autofocus
            />
        </div>
    }
</nav>
