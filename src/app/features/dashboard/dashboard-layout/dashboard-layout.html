<div class="dash-shell">
    <button class="dash-burger" type="button" (click)="menuOpen.set(!menuOpen())" aria-label="Menú">
        ☰
    </button>

    @if (menuOpen()) {
        <div class="dash-backdrop" (click)="menuOpen.set(false)"></div>
    }

    <aside class="dash-sidebar" [class.open]="menuOpen()">
        <nav class="dash-nav">
            @for (entry of nav; track entry.label) {
                <a
                    class="dash-link"
                    [routerLink]="entry.route"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: entry.route === '/dashboard' }"
                    (click)="menuOpen.set(false)"
                >
                    {{ entry.label }}
                </a>
                @if (entry.children?.length) {
                    <div class="dash-subnav">
                        @for (child of entry.children; track child.label) {
                            <a
                                class="dash-sublink"
                                [routerLink]="child.route"
                                routerLinkActive="active-sub"
                                [routerLinkActiveOptions]="{ exact: false }"
                                (click)="menuOpen.set(false)"
                            >
                                {{ child.label }}
                            </a>
                        }
                    </div>
                }
            }
        </nav>
    </aside>
    <main class="dash-main">
        <router-outlet />
    </main>
</div>
