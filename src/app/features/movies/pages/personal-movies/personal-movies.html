<div class="movies-page">
    @if (loading()) {
        <div class="content__movies">
            @for (_ of [].constructor(6); track $index) {
                <div class="movie-card-skeleton"></div>
            }
        </div>
    } @else if (movies(); as list) {
        @if (list.length) {
            <div class="content__movies">
                @for (movie of list; track movie.id) {
                    <app-card-movie-ui
                        [title]="movie.title"
                        [posterUrl]="posterUrl(movie)"
                        [rating]="movie.popularity"
                        [year]="movie.release_date.slice(0, 4)"
                        [link]="'/watch/' + movie.id"
                    ></app-card-movie-ui>
                }
            </div>
        } @else {
            <section class="empty-state">
                <h1>Tu catálogo está vacío</h1>
                <p>Añade tu primera película desde la sección Upload.</p>
            </section>
        }
    }
</div>
