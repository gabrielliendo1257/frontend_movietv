

<div class="container__movies__search">
    <div class="form__movie" autofocus>
        <app-input-search (queryChange)="searchMovies($event)"></app-input-search>
    </div>

    <app-circle-loader #loader>
        <div class="content__movies__search">
            @for (movie of movies; track movie.id) {
                <app-card-movie [moviesCatalog]="movie"></app-card-movie>
            }
        </div>
    </app-circle-loader>

</div>
