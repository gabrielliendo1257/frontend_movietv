@if (isAuth && isAdmin) {
    <app-admin-layout>
        <router-outlet></router-outlet>
    </app-admin-layout>
} @else if (isAuth && !isAdmin) {
    <app-auth-layout>
        <router-outlet></router-outlet>
    </app-auth-layout>
} @else {
    <app-public-layout>
        <router-outlet />
    </app-public-layout>
}
