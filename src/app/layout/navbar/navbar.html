<nav class="navbar">
    <div class="nav-inner">
        <!-- 1. Brand: identidad + volver a Home -->

            <span class="brand-m">M</span><span class="brand-v">V</span><span class="brand-name">FLIX</span>
        </a>

        <!-- 2. Destinos globales -->
        <app-primary-navigation class="nav-destinations" />

        <!-- 3–6. Acción primaria, búsqueda, actividad, usuario -->

            <app-user-menu />
