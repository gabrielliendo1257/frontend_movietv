<div class="search-container">

    <!-- ▶ State: Esperando búsqueda -->
    @if (state === 'idle') {
        <div class="state-box">
            <p class="msg">Search for a movie...</p>
        </div>
    }

    <!-- ▶ State: Loading -->
    @if (state === 'loading') {
        <div class="state-box">
            <div class="spinner"></div>
            <p class="msg">Searching movies...</p>
        </div>
    }

    <!-- ▶ State: Resultados -->
    @if (state === 'success') {
        <div class="results-grid">
            @for (movie of movies; track movie.id) {
                <div class="movie-card">
                    <img [src]="movie.poster" alt="poster"/>
                    <h3>{{ movie.title }}</h3>
                </div>
            }
        </div>
    }

    <!-- ▶ State: No results -->
    @if (state === 'empty') {
        <div class="state-box">
            <p class="msg">No movies found.</p>
        </div>
    }

</div>
