<div class="container__mini__card">
    <div class="image__movie">
        <img [src]="getPosterUrl(moviesCatalog()?.poster_path)" alt="No image"/>
    </div>
    <div class="container__data__movie">
        <div class="title__movie">{{ moviesCatalog()?.title }}</div>
        <div class="description__movie">{{ moviesCatalog()?.overview }}</div>
    </div>
</div>
